<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - MarketingFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4"
  >
    <div
      class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700"
    >
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">Get in Touch</h1>
        <p class="text-gray-400 text-sm">
          Tell us what you need, and our AI will connect you with the right team
          instantly.
        </p>
      </div>

      <form id="leadForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="name"
            required
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition"
            placeholder="John Doe"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition"
            placeholder="john@example.com"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1"
            >How can we help you?</label
          >
          <textarea
            id="message"
            required
            rows="4"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition"
            placeholder="I need a marketing automation system. Budget is $5000..."
          ></textarea>
        </div>
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition flex justify-center items-center"
        >
          <span id="btnText">Send Message</span>
          <svg
            id="spinner"
            class="animate-spin h-5 w-5 ml-2 hidden text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
        </button>
      </form>

      <div
        id="successMessage"
        class="hidden mt-6 p-4 bg-green-900 border border-green-500 rounded-lg text-center"
      >
        <h3 class="text-green-400 font-bold text-lg mb-1">Message Sent! 🎉</h3>
        <p class="text-green-200 text-sm">
          Our AI is analyzing your request. A sales rep will contact you
          shortly.
        </p>
      </div>
    </div>

    <script>
      document
        .getElementById("leadForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const btnText = document.getElementById("btnText");
          const spinner = document.getElementById("spinner");
          const submitBtn = document.getElementById("submitBtn");

          btnText.innerText = "Processing...";
          spinner.classList.remove("hidden");
          submitBtn.disabled = true;

          const uniqueId = "web_form_" + Date.now();
          const payload = {
            tenantId: "org_123",
            eventId: uniqueId,
            leadId: "lead_" + uniqueId,
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value,
          };

          try {
            // NOTE: Change this to '/webhook/lead-capture' (remove -test) when in production!
            const response = await fetch(
              "http://localhost:5678/webhook-test/lead-capture",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              },
            );

            if (response.ok) {
              document.getElementById("leadForm").classList.add("hidden");
              document
                .getElementById("successMessage")
                .classList.remove("hidden");
            } else {
              alert("Automation failed. Is n8n listening?");
              resetButton();
            }
          } catch (error) {
            alert("Failed to connect to n8n.");
            resetButton();
          }

          function resetButton() {
            btnText.innerText = "Send Message";
            spinner.classList.add("hidden");
            submitBtn.disabled = false;
          }
        });
    </script>
  </body>
</html>
