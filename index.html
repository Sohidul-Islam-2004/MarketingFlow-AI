<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketingFlow AI - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fast, lightweight scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header Navigation -->
        <header class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center shadow-md gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-xl shadow-lg">🤖</div>
                <div>
                    <h1 class="text-xl font-bold text-white">MarketingFlow AI</h1>
                    <p class="text-xs text-slate-400">Business Command Center</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Link to the Public Customer Form -->
                <a href="/contact.html" target="_blank" class="text-sm font-semibold text-indigo-400 hover:text-indigo-300 transition">
                    ↗ View Customer Form
                </a>
                
                <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-md border border-slate-700 text-xs font-semibold text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full"></span>
                    System Live
                </div>
            </div>
        </header>

        <!-- Main Grid Workspace -->
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
            
            <!-- LEFT COLUMN: LEADS (CRM) -->
            <div class="space-y-6">
                
                <!-- Lead Form (Simulation) -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">📥 Simulate New Lead</h2>
                    <form id="leadForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Customer Name</label>
                                <input type="text" id="leadName" required placeholder="John Doe" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Email Address</label>
                                <input type="email" id="leadEmail" required placeholder="john@company.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Message</label>
                            <textarea id="leadMessage" required rows="2" placeholder="I need a marketing tool. Budget is $5000." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition resize-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-lg transition text-sm shadow-md">
                            Send Lead to AI
                        </button>
                    </form>
                </div>

                <!-- Leads List -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">🔥 Recent Leads (CRM)</h2>
                    <div id="leads-container" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                        <p class="text-sm text-slate-400 text-center py-4">Loading leads...</p>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: CONTENT (MARKETING) -->
            <div class="space-y-6">
                
                <!-- Content Form -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">✍️ Generate AI Content</h2>
                    <form id="contentForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Target Platform</label>
                                <select id="contentPlatform" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                                    <option value="Facebook">Facebook</option>
                                    <option value="Instagram">Instagram</option>
                                    <option value="LinkedIn">LinkedIn</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 mb-1">Core Topic</label>
                                <input type="text" id="contentTopic" required placeholder="e.g., 50% off summer sale" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition text-sm shadow-md">
                            Generate Post with AI
                        </button>
                    </form>
                </div>

                <!-- Content List & Approval -->
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-sm">
                    <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">📝 AI Content Studio</h2>
                    <div id="content-container" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                        <p class="text-sm text-slate-400 text-center py-4">Loading content...</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. LEAD AUTOMATION FORM
        // ==========================================
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            
            btn.innerText = "Processing...";
            btn.disabled = true;
            btn.classList.add('opacity-75');

            const payload = {
                tenantId: "org_123",
                eventId: "form_evt_" + Date.now(),
                leadId: "lead_" + Date.now(),
                name: document.getElementById('leadName').value,
                email: document.getElementById('leadEmail').value,
                message: document.getElementById('leadMessage').value
            };

            try {
                await fetch('http://localhost:5678/webhook/lead-capture', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Wait 2 seconds for n8n to process and save to MySQL, then reload the list
                setTimeout(() => {
                    loadLeads();
                    this.reset();
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                }, 2000);
            } catch (error) {
                alert("Error: Make sure n8n is running and workflows are Published.");
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });

        // ==========================================
        // 2. CONTENT GENERATION FORM
        // ==========================================
        document.getElementById('contentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            
            btn.innerText = "Generating...";
            btn.disabled = true;
            btn.classList.add('opacity-75');

            const payload = {
                tenantId: "org_123",
                platform: document.getElementById('contentPlatform').value,
                topic: document.getElementById('contentTopic').value
            };

            try {
                await fetch('http://localhost:5678/webhook/generate-content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Wait 3 seconds for AI to generate, then reload the list
                setTimeout(() => {
                    loadContent();
                    this.reset();
                    btn.innerText = originalText;
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                }, 3000);
            } catch (error) {
                alert("Error: Make sure n8n is running and workflows are Published.");
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        });

        // ==========================================
        // 3. LOAD LEADS FROM MYSQL
        // ==========================================
        async function loadLeads() {
            try {
                const response = await fetch('/api/leads');
                const leads = await response.json();
                const container = document.getElementById('leads-container');
                
                if (leads.length === 0) { 
                    container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No leads yet. Send one above!</p>'; 
                    return; 
                }
                
                container.innerHTML = leads.map(lead => {
                    const isHot = lead.aiStatus === 'Hot';
                    const badgeColor = isHot ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-blue-500/20 text-blue-400 border-blue-500/30';
                    const borderColor = isHot ? 'border-l-red-500' : 'border-l-blue-500';

                    return `
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 border-l-4 ${borderColor}">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="font-bold text-sm text-white">${lead.name}</h3>
                                    <p class="text-xs text-slate-400">${lead.email}</p>
                                </div>
                                <span class="px-2 py-1 text-xs font-bold rounded-md border ${badgeColor}">
                                    ${lead.aiStatus} (${lead.aiScore})
                                </span>
                            </div>
                            <p class="text-xs text-slate-300 mt-2 bg-slate-800 p-2 rounded italic">"${lead.aiReason}"</p>
                        </div>`;
                }).join('');
            } catch (error) {
                console.error("Error loading leads", error);
            }
        }

        // ==========================================
        // 4. LOAD CONTENT FROM MYSQL
        // ==========================================
        async function loadContent() {
            try {
                const response = await fetch('/api/content');
                const content = await response.json();
                const container = document.getElementById('content-container');
                
                if (content.length === 0) { 
                    container.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No content generated yet.</p>'; 
                    return; 
                }
                
                container.innerHTML = content.map(item => {
                    const isApproved = item.status === 'Approved';
                    const badgeColor = isApproved ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30';
                    const borderColor = isApproved ? 'border-l-emerald-500' : 'border-l-yellow-500';

                    return `
                        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 border-l-4 ${borderColor}">
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold text-sm text-white capitalize">${item.platform} Post</h3>
                                <span class="px-2 py-1 text-[10px] uppercase font-bold rounded-md border ${badgeColor}">
                                    ${item.status}
                                </span>
                            </div>
                            
                            <p class="text-xs text-slate-300 whitespace-pre-wrap mb-3">${item.generatedText}</p>
                            
                            <div class="flex justify-between items-center border-t border-slate-700 pt-3">
                                <p class="text-[10px] text-slate-500 truncate max-w-[150px]">Topic: ${item.topic}</p>
                                ${item.status === 'Draft' 
                                    ? `<button onclick="approveContent('${item.id}')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-1 px-3 rounded transition shadow-sm">Approve & Post</button>` 
                                    : `<span class="text-emerald-400 text-xs font-bold">✓ Published</span>`
                                }
                            </div>
                        </div>`;
                }).join('');
            } catch (error) {
                console.error("Error loading content", error);
            }
        }

        // ==========================================
        // 5. APPROVE & PUBLISH
        // ==========================================
        async function approveContent(id) {
            try {
                const response = await fetch(`/api/content/${id}/approve`, { method: 'PUT' });
                if (response.ok) {
                    loadContent(); // Refresh the list immediately to show "Published"
                } else {
                    alert("Failed to approve. Check your Node.js terminal for errors.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        // Run initial load
        loadLeads();
        loadContent();
    </script>
</body>
</html>
