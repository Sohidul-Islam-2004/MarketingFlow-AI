<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MarketingFlow AI</title>
    <meta name="theme-color" content="#0f1424" />
    <!-- Phone: "Add to Home screen" opens MarketingFlow full screen, like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MarketingFlow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M24 8 17.5 25l-3.2-7.3L7 14.5z' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600&display=swap" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/phone.css" media="(max-width: 800px)" /><!-- the whole phone look -->
  </head>
  <body>
    <!-- Login / sign-up screen (js/app.js shows it when you are logged out) -->
    <div id="auth" class="auth hidden"></div>

    <!-- The dashboard -->
    <div id="app" class="hidden">
      <!-- Phone only: top bar (back arrow on inner pages, page name, notifications) -->
      <header class="topbar">
        <button class="top-back" id="topBack" hidden aria-label="Back"></button>
        <div class="logo" id="topLogo"></div>
        <b id="topTitle">MarketingFlow AI</b>
        <button class="bell" id="topBell" aria-label="Notifications"></button>
      </header>
      <aside id="side"><!-- computer: the side menu (a phone shows the bottom bar instead) -->
        <div class="brand">
          <div class="logo" id="logo"></div>
          <span>MarketingFlow AI</span>
          <button class="bell" id="bell" title="Notifications"></button>
        </div>
        <nav id="nav"></nav>
        <div class="me">
          <div class="avatar" id="meAvatar"></div>
          <div><b id="meName"></b><small id="meBusiness"></small></div>
          <button id="logout" title="Log out"></button>
        </div>
      </aside>
      <main id="page"></main>
      <!-- Phone only: bottom bar Home · Chats · Orders · Products · More (filled by js/app.js) -->
      <nav class="tabbar" id="tabbar"></nav>
    </div>

    <!-- One shared pop-up window (js/ui.js -> openModal) -->
    <dialog id="modal">
      <form method="dialog" id="modalForm">
        <div class="dlg-head"><h3 id="modalTitle"></h3><button type="button" id="modalClose">×</button></div>
        <div class="dlg-body" id="modalBody"></div>
        <div class="dlg-foot" id="modalFoot"></div>
      </form>
    </dialog>
    <!-- Small "Are you sure?" pop-up (js/ui.js -> confirmBox) -->
    <dialog id="confirm">
      <div class="dlg-body"><p id="confirmText"></p></div>
      <div class="dlg-foot"><button class="btn light" id="confirmNo">Cancel</button><button class="btn" id="confirmYes">OK</button></div>
    </dialog>
    <div class="toasts" id="toasts"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
